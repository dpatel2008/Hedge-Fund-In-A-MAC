name: Daily SEC Filing Check

on:
  schedule:
    - cron: '17 11 * * 2-6'
    - cron: '17 12 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sec-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      done: ${{ steps.today.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: See if this morning's results are already saved
        id: today
        run: |
          # results saved since 10:00 UTC today (6 AM New York time in summer, 5 AM in winter) count as this morning's
          if git log --since="$(date -u +%Y-%m-%d)T10:00:00Z" --author="github-actions" --format=%h | grep -q .; then
            echo "done=yes" >> "$GITHUB_OUTPUT"
            echo "This morning's results are already saved, so this backup run does nothing."
          else
            echo "done=no" >> "$GITHUB_OUTPUT"
          fi

  run-script:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.done != 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Get the latest EDGAR filings
        run: python sec_daily_watcher.py

      - name: Check for insider-selling and insider-buying clusters
        run: python form4_cluster_check.py

      - name: Check for going concern language
        run: python going_concern_check.py

      - name: Check 8-Ks for good news
        run: python positive_8k_check.py

      - name: Look up tickers
        run: python ticker_lookup.py

      - name: First scoring pass
        run: python scoring_engine.py --no-market

      - name: Pull market data for the top names
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python market_enrichment.py

      - name: Final scoring pass
        run: python scoring_engine.py

      - name: Build the dashboard
        run: python generate_dashboard.py

      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f daily_signals_ranked.csv
          git commit --allow-empty -m "Update daily results"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push did not work, trying again in 10 seconds..."
            sleep 10
          done
          exit 1

      - name: Email the reports
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily SEC Signal Report"
          to: ${{ secrets.EMAIL_TO }}
          from: SEC Filing Watcher
          body: "Attached: the ranked report (open dashboard.html first) plus the raw data files."
          attachments: dashboard.html,daily_signals_ranked.csv,form4_clusters.csv,form4_buys.csv,going_concern_flags.csv,positive_8k_flags.csv,market_context.csv,all_filings.csv

      - uses: actions/upload-artifact@v4
        with:
          name: daily-reports
          path: |
            dashboard.html
            daily_signals_ranked.csv
            form4_clusters.csv
            form4_buys.csv
            going_concern_flags.csv
            positive_8k_flags.csv
            market_context.csv
            all_filings.csv
